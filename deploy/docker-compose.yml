# Echo Protocol
#
# Deploys the Echo protocol generator on a Raspberry Pi (rpi3). A host-level
# cloudflared tunnel (one per device, multiple domains) proxies the Echo web
# UI at localhost:8501. Tailscale provides admin SSH access.
#
# The same compose file is generated on the Pi by the deploy workflows
# (.github/workflows/deploy.yml, release.yml), so keep them in sync.

services:
  echo-protocol:
    image: ghcr.io/atmollohan/echo:latest
    container_name: echo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - echo-data:/app/generated
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  echo-data: