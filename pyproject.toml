[project]
name = "echo-lab-protocol"
version = "0.2.0"
description = "A user-friendly tool for generating Beckman Echo liquid handler protocols"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.67.0",
    "papermill>=2.6.0",
    "jupyter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
echo-protocol-generate = "echo_run.cli:main"

[tool.setuptools.packages.find]
include = ["echo_run*"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
