name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      release_created: ${{ steps.semver.outputs.release_created }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      PI_HOSTNAME: rpi3
      PI_USER: mollopi5
      APP_DIR: /home/mollopi5/projects/echo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: semver
        uses: paulhatch/semver-version@v5
        with:
          tag_prefix: "v"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          generate_release_notes: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:v${{ steps.semver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy app on Pi
        run: |
          tailscale ssh "${{ env.PI_USER }}@${{ env.PI_HOSTNAME }}" "
            set -e
            mkdir -p ${{ env.APP_DIR }}

            echo 'TUNNEL_TOKEN=${{ secrets.TUNNEL_TOKEN }}' > ${{ env.APP_DIR }}/.env

            echo '' | base64 -d | sed 's|MAG_PLACEHOLDER|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g' > ${{ env.APP_DIR }}/docker-compose.yml

            if [ -n '${{ secrets.GHCR_PAT }}' ]; then echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin; fi
            docker compose -f ${{ env.APP_DIR }}/docker-compose.yml --env-file ${{ env.APP_DIR }}/.env pull
            docker compose -f ${{ env.APP_DIR }}/docker-compose.yml --env-file ${{ env.APP_DIR }}/.env up -d
            echo 'Verifying container...'
            docker ps --filter name=echo --format '{{.Status}}'
          "
          echo "Deploy complete"

      - name: Verify health
        run: |
          sleep 15
          tailscale ssh "${{ env.PI_USER }}@${{ env.PI_HOSTNAME }}" "
            CONTAINER=echo
            status=\$(docker inspect -f '{{.State.Status}}' \$CONTAINER 2>/dev/null)
            restart_count=\$(docker inspect -f '{{.RestartCount}}' \$CONTAINER 2>/dev/null)
            echo \"Container status: \$status\"
            echo \"Restart count: \$restart_count\"
            if [ \"\$status\" != \"running\" ]; then
              echo 'ERROR: Container is not running'
              docker logs \$CONTAINER --tail 20
              exit 1
            fi
            if [ \"\$restart_count\" -gt 3 ]; then
              echo 'ERROR: Container in restart loop'
              docker logs \$CONTAINER --tail 20
              exit 1
            fi
            echo 'App is healthy'
          "
